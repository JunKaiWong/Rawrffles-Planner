# Scheduled maintenance, run here rather than on the host.
#
# Render's free plan spins the service down when idle, and a sleeping service
# fires no timers - an in-process scheduler would simply never run. GitHub
# Actions has its own clock and reaches Neon directly, so these jobs do not
# depend on the web service being awake at all.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   ALLOWED_USER_IDS

name: Scheduled jobs

on:
  schedule:
    # Daily reminders: 01:00 UTC is 09:00 in Singapore, so an anniversary is
    # mentioned over breakfast rather than in the middle of the night. This one
    # posts to the group, so its timing is the one that is actually felt.
    - cron: "0 1 * * *"
    # Weekly: refresh yt-dlp and retry links it previously could not read.
    # Mondays 04:15 UTC. GitHub queues cron on shared runners, so treat the
    # time as approximate.
    - cron: "15 4 * * 1"
    # Daily: parse any captions still waiting, a few at a time to stay inside
    # the Gemini free tier's allowance.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: reminders
        type: choice
        options: [reminders, captions, extractor]

concurrency:
  # Two runs writing the same rows would double-spend Gemini quota.
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      GEMINI_MODEL: gemini-3.6-flash
      # The jobs read settings from the environment; there is no .env here.
      ENV_FILE: .env.ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Every job loads the same settings, so a missing secret fails all of
      # them - but as a Python traceback partway through a run, which reads
      # like a code fault rather than a configuration one. Check first and say
      # exactly which secrets are absent.
      - name: Check required secrets are set
        run: |
          missing=""
          for name in DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ALLOWED_USER_IDS GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Names must match exactly, including case."
            echo ""
            echo "All five are needed even by jobs that do not message Telegram,"
            echo "because settings are loaded as one unit before any job runs."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post reminders for upcoming dates
        if: github.event.schedule == '0 1 * * *' || inputs.job == 'reminders'
        run: python -m app.jobs.daily_reminders

      - name: Refresh yt-dlp and retry unreadable links
        if: github.event.schedule == '15 4 * * 1' || inputs.job == 'extractor'
        run: python -m app.jobs.refresh_extractor

      - name: Parse captions still waiting
        if: github.event.schedule == '30 5 * * *' || inputs.job == 'captions'
        run: python -m app.jobs.backfill_captions --limit 10
